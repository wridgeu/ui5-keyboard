name: Setup Node and install
description: >
  Shared job setup: Node 24, UI5 framework cache, and npm ci (which applies the
  postinstall patches), skipped when the node_modules cache hits. Checkout stays
  in each job: a local composite action only resolves after checkout.

inputs:
  registry-url:
    description: npm registry URL (set in publish jobs to enable auth); empty skips registry configuration
    default: ""

runs:
  using: composite
  steps:
    # Cache the install tree so a hit skips `npm ci`. Key on the lockfile,
    # manifests, and postinstall inputs (.patch files, apply-nested.mjs, .npmrc).
    # Exact match only, no restore-keys: a partial tree must never suppress
    # `npm ci`. Before setup-node so the ~/.npm cache is gated on the same hit.
    - name: Cache node_modules
      id: node-modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          node_modules
          packages/*/node_modules
        key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'package.json', 'packages/*/package.json', 'patches/*.patch', 'patches/apply-nested.mjs', '.npmrc') }}

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        # Pins Node 24; setup-node resolves the latest 24.x patch, whose bundled
        # npm meets the engines npm floor (>= 11.10.0) required by the
        # min-release-age supply-chain cooldown (root .npmrc). Do not drop below Node 24.
        node-version: 24
        # ~/.npm only feeds `npm ci`; skip restoring it when the hit above
        # skips `npm ci` (empty `cache` disables setup-node caching).
        cache: ${{ steps.node-modules.outputs.cache-hit != 'true' && 'npm' || '' }}
        registry-url: ${{ inputs.registry-url }}

    - name: Cache UI5 framework resources
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.ui5
        key: ui5-${{ hashFiles('packages/*/ui5*.yaml') }}
        restore-keys: ui5-

    - if: steps.node-modules.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash
