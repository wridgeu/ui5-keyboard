name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force-publish:
        description: "Force npm publish for all packages (bypass release_created check)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Includes the package smoke tests (`smoke` job), so a packaging break blocks
  # the release the same way it blocks a pull request.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release-please:
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      hotkeys_release_created: ${{ steps.release.outputs['packages/hotkeys--release_created'] }}
      kiosk_release_created: ${{ steps.release.outputs['packages/kiosk-keyboard--release_created'] }}
      webc_release_created: ${{ steps.release.outputs['packages/kiosk-keyboard-webc--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-hotkeys:
    needs: [release-please]
    if: needs.release-please.outputs.hotkeys_release_created == 'true' || inputs.force-publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org

      # prepublishOnly builds; OIDC auth via id-token: write
      - run: npm publish -w packages/hotkeys --provenance --access public
        env:
          NODE_AUTH_TOKEN: ""

  publish-kiosk:
    needs: [release-please]
    if: needs.release-please.outputs.kiosk_release_created == 'true' || inputs.force-publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org

      - run: npm publish -w packages/kiosk-keyboard --provenance --access public
        env:
          NODE_AUTH_TOKEN: ""

  publish-webc:
    needs: [release-please]
    if: needs.release-please.outputs.webc_release_created == 'true' || inputs.force-publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org

      - run: npm publish -w packages/kiosk-keyboard-webc --provenance --access public
        env:
          NODE_AUTH_TOKEN: ""
