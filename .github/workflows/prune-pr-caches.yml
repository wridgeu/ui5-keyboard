name: Prune PR caches

# A PR's caches are scoped to its merge ref (refs/pull/<n>/merge) and reusable
# only on that PR, yet count against the repo's 10 GB budget until GitHub's
# 7-day reaper clears them. Delete them on close so they don't crowd out the
# reusable main-scoped caches (#158). Storage-only: a failed prune just costs a
# cold install on the next run.
on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  prune:
    # Fork PRs run with a read-only token that cannot delete caches; skip them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
    timeout-minutes: 5
    steps:
      # Built-in `gh cache` (preinstalled, no third-party extension). Delete
      # each merge-ref cache by id; an empty list is a no-op.
      - name: Delete caches scoped to the closed PR's merge ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        shell: bash
        run: |
          ids=$(gh cache list --repo "$REPO" --ref "$REF" --limit 100 --json id --jq '.[].id')
          if [ -z "$ids" ]; then
            echo "No caches scoped to $REF."
            exit 0
          fi
          for id in $ids; do
            echo "Deleting cache $id"
            gh cache delete "$id" --repo "$REPO"
          done
