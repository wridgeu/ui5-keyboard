name: Deploy Pages

# Builds the static Fiori Launchpad (FLP) demo plus the framework-less web
# components demo page and publishes them to GitHub Pages. The FLP sandbox is
# served statically (no preview-middleware): see packages/demo-app/webapp/flp.html.
#
# The demo is fully self-hosted with NO external CDN: `build:pages` builds the
# demo with the SAPUI5 framework (ui5-pages.yaml) via `ui5 build --all`, bundling
# the UI5 runtime + ushell shell into the artifact, then trims it down with
# tools/trim-pages-dist.mjs (~525 MB -> ~140 MB).
#
# The deploy job's Setup Pages step provisions the Pages site on first run
# (configure-pages enablement: true, source "GitHub Actions"), so no manual repo
# Settings step is required; this also lets a fresh fork deploy with no setup.

on:
  push:
    branches: [main]
    # Skip the rebuild for pushes that can't change the built site (tests, docs,
    # other workflows). Skipped only when every changed file matches; use
    # workflow_dispatch to force a deploy.
    paths-ignore:
      # Ignore the non-deployed test suites only. kiosk-keyboard-webc/test/pages
      # is the source of the deployed "Raw Web Components Demo" and is
      # deliberately NOT ignored, so edits there still trigger a deploy.
      - "**/test/qunit/**"
      - "**/test/e2e/**"
      - "**/test/component/**"
      - "**/test/unit/**"
      - "**/test/helpers/**"
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/prune-pr-caches.yml"
  workflow_dispatch:

permissions: {}

# Allow only one concurrent deployment; do not cancel an in-progress deploy so a
# running publish always finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Self-hosting SAPUI5 downloads + builds its ushell dependency closure on a
    # cold ~/.ui5 cache, which is heavier than the OpenUI5 build.
    timeout-minutes: 30
    # This job launches no browser, so skip puppeteer's postinstall Chrome
    # download on a node_modules cache miss; see ci.yml's unit-webc job for the
    # full reasoning. The browser lands in ~/.cache/puppeteer, not node_modules,
    # so skipping it leaves the shared node_modules cache identical.
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 24 + npm cache, the ~/.ui5 framework cache, and npm ci (with the
      # postinstall patches) are all provided by the shared composite action.
      - uses: ./.github/actions/setup

      # build:pages = libraries (hotkeys -> kiosk -> kiosk-webc) then the demo
      # app via the SAPUI5 self-hosting config (ui5 build --all bundles the UI5
      # runtime + ushell + the custom libs into dist/), then trimmed down by
      # tools/trim-pages-dist.mjs. The demo's ui5-tooling-modules bundling of
      # kiosk-keyboard-webc resolves against its freshly built dist/.
      - name: Build libraries and self-hosted demo app
        run: npm run build:pages

      - name: Build raw web components demo page
        run: npm run build:demo-page -w packages/kiosk-keyboard-webc

      - name: Assemble _site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Self-hosted demo app build output at the artifact root: flp.html,
          # index.html, Component-preload.js, manifest.json, and the bundled UI5
          # runtime + ushell + custom libraries under resources/ (from `ui5 build
          # --all`, trimmed). No separate custom-lib copy needed - `--all` already
          # placed ui5.hotkeys / ui5.kiosk under resources/ui5/.
          cp -r packages/demo-app/dist/. _site/

          # Framework-less standalone web components demo, opened by the FLP
          # "Raw Web Components Demo" URL tile (./webc-demo/index.html). Kept in
          # its own folder, separate from the demo app's internal ./webc/
          # wrapper modules.
          mkdir -p _site/webc-demo
          cp -r packages/kiosk-keyboard-webc/demo-dist/. _site/webc-demo/

          # The demo app's own index.html loads the component standalone, without
          # the Fiori Launchpad shell; replace it with a redirect so the FLP is
          # the site entry point.
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta http-equiv="refresh" content="0; url=./flp.html" />
              <title>UI5 Keyboard Libraries: Fiori Launchpad</title>
            </head>
            <body>
              <a href="./flp.html">Open the Fiori Launchpad</a>
            </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Runs here rather than in `build`: configure-pages needs pages/id-token,
      # and the deploy job already holds both, so keeping it out of the build job
      # leaves that job (which installs and builds the whole workspace) on a
      # contents:read token. Its outputs are unused, so placement only has to put
      # it ahead of deploy-pages.
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # Provision the Pages site (source "GitHub Actions") if it does not
          # exist yet, instead of failing with "Get Pages site failed".
          enablement: true

      # configure-pages above only creates a site that does not exist; against an
      # existing one it performs a GET and succeeds. So a site left on the legacy
      # (branch) build type stays there, GitHub serves Jekyll over the repo root
      # -- rendering README.md as the site and 404ing flp.html -- and every step
      # here still reports success. That is exactly what happened: 8 consecutive
      # green deploys published nothing. Fail loudly instead of deploying an
      # artifact nothing will serve.
      - name: Assert Pages serves this workflow's artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)
          if [ "$build_type" != "workflow" ]; then
            echo "::error::Pages build_type is '$build_type', not 'workflow'. GitHub is serving a branch build, so this artifact would be uploaded and ignored. Fix: Settings > Pages > Source: GitHub Actions (or: gh api -X PUT repos/${GITHUB_REPOSITORY}/pages -f build_type=workflow)."
            exit 1
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
