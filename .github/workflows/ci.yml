name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache UI5 framework resources
        uses: actions/cache@v4
        with:
          path: ~/.ui5
          key: ui5-${{ hashFiles('packages/*/ui5*.yaml') }}
          restore-keys: ui5-

      - run: npm ci

      - name: Commitlint
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: Check formatting
        run: npm run fmt:check

      - name: Lint
        run: npm run lint

      - name: UI5 lint
        run: npm run lint:ui5

      - name: Check visual baselines
        run: npm run check:baselines

      - name: Typecheck
        run: npm run typecheck

      - name: Tools tests
        run: npm run test:tools

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-chromium-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Tests
        run: npm run test:qunit && npm run test:kiosk-webc && npm run test:kiosk-webc:component
