name: CI

on:
  # Run on every PR regardless of base branch, so stacked PRs (e.g. against an
  # in-flight branch, not just main) are gated too.
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm

      - name: Cache UI5 framework resources
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.ui5
          key: ui5-${{ hashFiles('packages/*/ui5*.yaml') }}
          restore-keys: ui5-

      - run: npm ci

      - name: Commitlint
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: Check formatting
        run: npm run fmt:check

      - name: Lint
        run: npm run lint

      - name: UI5 lint
        run: npm run lint:ui5

      - name: Typecheck
        run: npm run typecheck

      - name: Cache Playwright browsers
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-chromium-

      # Installs the OS libraries chromium needs (shared by Playwright's and the
      # puppeteer backend's chromium) plus Playwright's chromium for the e2e
      # suites. The puppeteer backend's chromium is fetched by npm ci above.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Tests
        run: npm run test:qunit && npm run test:kiosk-webc && npm run test:kiosk-webc:component

      # Behavioral e2e assertions are platform-independent; visual snapshots are
      # not (baselines carry no platform suffix), so they are ignored here. This
      # gates focus/auto-type/inputmode/i18n/interop behavior and runs the visual
      # specs as render smoke tests without pixel-comparing OS-specific baselines.
      - name: End-to-end (behavioral; visual snapshots ignored)
        run: npm run test:e2e:ci
