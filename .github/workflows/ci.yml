name: CI

on:
  # Run on every PR regardless of base branch, so stacked PRs (e.g. against an
  # in-flight branch, not just main) are gated too.
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # Restored before `npm ci` (in the setup action) because puppeteer's
      # postinstall downloads its Chrome (~170 MB) into ~/.cache/puppeteer.
      - name: Cache puppeteer Chrome
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-chrome-${{ hashFiles('package-lock.json') }}
          restore-keys: puppeteer-chrome-

      - uses: ./.github/actions/setup

      - name: Commitlint
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: Check formatting
        run: npm run fmt:check

      - name: Lint
        run: npm run lint:ci

      - name: UI5 lint
        run: npm run lint:ui5

      - name: Typecheck
        run: npm run typecheck

      # Verifies the load-bearing less-openui5 parser patch still produces the
      # @container/@layer at-rules the kiosk theme build depends on (the patch is
      # applied by postinstall during `npm ci` above).
      - name: Patch regression tests
        run: npm run test:patches

      # Compares the deliberately hand-duplicated kiosk <-> kiosk-webc twin
      # modules (layouts + core helpers) after normalization; see
      # tools/check-twin-drift.mjs for the pair manifest.
      - name: Twin-drift check
        run: npm run test:twin-drift

      - name: Cache Playwright browsers
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-chromium-

      # Installs the OS libraries chromium needs (shared by Playwright's and the
      # puppeteer backend's chromium) plus Playwright's chromium for the e2e
      # suites. The puppeteer backend's chromium is fetched by npm ci above.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Tests
        run: npm run test:qunit && npm run test:kiosk-webc && npm run test:kiosk-webc:component

      # Behavioral e2e assertions are platform-independent; visual snapshots are
      # not (baselines carry no platform suffix), so they are ignored here. This
      # gates focus/auto-type/inputmode/i18n/interop behavior and runs the visual
      # specs as render smoke tests without pixel-comparing OS-specific baselines.
      # Trade-off: only the desktop project runs in CI; the phone/tablet device
      # projects are never exercised here and rely on the local all-devices runs.
      - name: End-to-end (behavioral; visual snapshots ignored)
        run: npm run test:e2e:ci
