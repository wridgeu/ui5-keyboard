name: CI

on:
  # Run on every PR regardless of base branch, so stacked PRs (e.g. against an
  # in-flight branch, not just main) are gated too.
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions: {}

# The pipeline is split into parallel jobs (static / unit-qunit / unit-webc /
# e2e) that each start from the shared setup action, so the slowest job (not
# their sum) sets the wall-clock. They are independent: no job consumes
# another's build output. The two unit jobs are split by browser stack, not just
# for parallelism: each then provisions one of puppeteer / playwright rather
# than both.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static analysis + fast Node-only checks. No browser needed.
  static:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # commitlint below diffs base..head, so it needs full history.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Commitlint
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: Check formatting
        run: npm run fmt:check

      - name: Lint
        run: npm run lint:ci

      - name: UI5 lint
        run: npm run lint:ui5

      - name: Typecheck
        run: npm run typecheck

      # The kiosk interfaces are committed (see CONTRIBUTING.md "Generated files in
      # version control"); regenerate them and fail on drift so the silent JSDoc-strip
      # class (#142/#143/#149) is a red build, not a stripped diff in a commit.
      # The glob covers every *.gen.d.ts rather than one path literal: `npm run
      # generate` is project-wide, so a newly added control produces a second
      # interface a literal would not watch. `git add -A` first because `git diff`
      # alone is blind to a generated file that was never committed, so a brand-new
      # *.gen.d.ts would pass an unstaged check with exit 0.
      - name: Verify generated interfaces are in sync
        run: |
          npm run generate -w packages/kiosk-keyboard
          git add -A -- packages/kiosk-keyboard/src
          if ! git diff --cached --exit-code -- ':(glob)packages/kiosk-keyboard/src/**/*.gen.d.ts'; then
            echo "::error::A generated interface under packages/kiosk-keyboard/src is out of sync (see diff above). Run 'npm run generate -w packages/kiosk-keyboard' and commit the result."
            exit 1
          fi

      # Verifies the load-bearing less-openui5 parser patch still produces the
      # @container/@layer at-rules the kiosk theme build depends on (the patch is
      # applied by postinstall during `npm ci` above).
      - name: Patch regression tests
        run: npm run test:patches

      # Compares the deliberately hand-duplicated kiosk <-> kiosk-webc twin
      # modules (layouts + core helpers + middleware) after normalization; see
      # tools/check-twin-drift.mjs for the pair manifest.
      - name: Twin-drift check
        run: npm run test:twin-drift

      # Asserts the two hand-maintained dom-contract.ts twins keep parallel
      # semantic key sets (values legitimately differ by naming convention) and
      # identical CORE data attributes (platform-only ones allowlisted); see
      # tools/check-dom-contract-drift.mjs.
      - name: DOM-contract drift check
        run: npm run test:dom-contract

      # Unit tests for the custom oxlint rules in tools/, on oxlint's own
      # RuleTester and Node's built-in test runner. These rules gate every other
      # lint run, so a silently broken regex or AST matcher would disarm it.
      - name: Lint-plugin rule tests
        run: npm run test:lint-plugins

      # Asserts the two hand-mirrored stylesheets expose the same public custom
      # property set, compared modulo the camelCase/kebab-case naming split; see
      # tools/check-style-twin-drift.mjs.
      - name: Stylesheet twin-drift check
        run: npm run test:style-twin-drift

      # Asserts every message bundle stays ASCII (a raw UTF-8 value decodes to
      # mojibake wherever the bundle is not served as UTF-8, and it lands in an
      # ARIA announcement nothing on screen shows) and that each locale declares
      # exactly the default bundle's keys; see tools/check-i18n-bundles.mjs.
      - name: Message-bundle check
        run: npm run test:i18n-bundles

  # QUnit for the two UI5 libraries, on the puppeteer backend ui5-test-runner
  # drives. Split from the web-component suites below so each leg provisions one
  # browser stack instead of both: this job never touches ~/.cache/ms-playwright.
  # Consolidating the two stacks was evaluated and declined -- ui5-test-runner's
  # bundled `$/playwright.js` shells out to a bare `npx playwright install` on
  # every run, which fetches headed chromium, firefox and webkit and would undo
  # the --only-shell narrowing below.
  unit-qunit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Restored before `npm ci` (in the setup action) because puppeteer's
      # postinstall downloads its Chrome (~170 MB) into ~/.cache/puppeteer.
      - name: Cache puppeteer Chrome
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-chrome-${{ hashFiles('package-lock.json') }}
          restore-keys: puppeteer-chrome-

      - uses: ./.github/actions/setup

      # A node_modules cache hit skips `npm ci` (and puppeteer's postinstall),
      # so re-run its installer: a no-op when the Chrome cache above is warm,
      # a download when it was evicted independently.
      - name: Ensure puppeteer Chrome
        run: node node_modules/puppeteer/install.mjs

      # `install-deps`, not `install --with-deps`: puppeteer's Chrome needs the
      # same OS libraries Playwright's chromium does, and this leg has to keep
      # installing them now that it no longer installs a Playwright browser to
      # carry them in. Downloads no browser, so the ms-playwright cache is not
      # needed here at all.
      - name: Install chromium OS dependencies
        run: npx playwright install-deps chromium

      - name: QUnit suites (hotkeys + kiosk)
        run: npm run test:qunit

  # vitest (jsdom) and web-test-runner (playwright chromium) for the web
  # component. Never launches puppeteer, so it neither caches nor downloads it.
  unit-webc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    # puppeteer is a root devDependency, so a node_modules cache miss would run
    # its postinstall and pull ~170 MB of Chrome this job never launches. The
    # browser lands in ~/.cache/puppeteer, not node_modules, so skipping it
    # leaves the shared node_modules cache identical to the other jobs'.
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-shell-

      # --only-shell: `install chromium` fetches the full headed build and the
      # headless shell, and a headless launch resolves to the shell, so the headed
      # build is downloaded and cached for nothing. Every browser CI starts is
      # headless; the headed and --ui runs are local-only scripts.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps --only-shell chromium

      # One step per runner, not an `&&` chain: the step boundary is what makes
      # GitHub report which suite failed and how long each took. Semantics are
      # unchanged -- a failing step still fails the job and skips the rest.
      - name: Web component unit suite (vitest)
        run: npm run test:kiosk-webc

      - name: Web component suite (web-test-runner)
        run: npm run test:kiosk-webc:component

  # Behavioral e2e assertions are platform-independent; visual snapshots are
  # not (baselines carry no platform suffix), so they are ignored here. This
  # gates focus/auto-type/inputmode/i18n/interop behavior and runs the visual
  # specs as render smoke tests without pixel-comparing OS-specific baselines.
  #
  # The two packages run as parallel matrix legs so neither waits on the other.
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [kiosk-keyboard, kiosk-keyboard-webc]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-shell-

      # --only-shell: see the unit job. Every browser CI starts is headless, and a
      # headless launch resolves to the shell, not the headed build.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps --only-shell chromium

      # One invocation over every project; per-project spec selection lives in
      # playwright.config.ts.
      - name: End-to-end (behavioral; visual snapshots ignored)
        run: npm run test:e2e:ci -w packages/${{ matrix.package }}
