<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>KioskKeyboard Interop Test</title>
    <script
      id="sap-ui-bootstrap"
      src="../../../../../resources/sap-ui-core.js"
      data-sap-ui-theme="sap_horizon"
      data-sap-ui-libs="sap.m,ui5.kiosk"
      data-sap-ui-compat-version="edge"
      data-sap-ui-resource-roots='{"ui5.kiosk": "../../../../../resources/ui5/kiosk/", "interop": "./"}'
      data-sap-ui-async="true"
      data-sap-ui-on-init="module:interop/init"
    ></script>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: "72", Arial, sans-serif;
        background: #f5f6f7;
      }
      .slot {
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <h1 style="font-size: 20px; color: #32363a">StepInput + TextArea + Bridge Interop</h1>
    <div id="interop-input" class="slot"></div>
    <div id="interop-step" class="slot"></div>
    <div id="interop-textarea" class="slot"></div>
    <div id="interop-custom-host" class="slot"></div>
    <div id="interop-shadow-host" class="slot"></div>
    <div id="interop-bridge" class="slot"></div>
    <div id="interop-shadow-bridge" class="slot"></div>
    <div id="interop-kb" class="slot"></div>
    <button id="interop-blur" style="padding: 10px 16px">Blur target</button>
  </body>
</html>
