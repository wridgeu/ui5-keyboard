<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KioskKeyboard Theme Visual Test</title>
    <script
      id="sap-ui-bootstrap"
      src="../../../../../resources/sap-ui-core.js"
      data-sap-ui-theme="sap_horizon"
      data-sap-ui-libs="sap.m, ui5.kiosk"
      data-sap-ui-compat-version="edge"
      data-sap-ui-resource-roots='{"ui5.kiosk": "../../../../../resources/ui5/kiosk/", "visual": "./"}'
      data-sap-ui-async="true"
      data-sap-ui-on-init="module:visual/themes-init"
    ></script>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: "72", Arial, sans-serif;
        background: #f5f6f7;
      }
      .keyboard-container {
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="keyboard-container" id="kb-qwerty"></div>
    <div class="keyboard-container" id="kb-numpad"></div>
  </body>
</html>
