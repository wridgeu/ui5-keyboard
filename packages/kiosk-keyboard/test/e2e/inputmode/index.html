<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>KioskKeyboard inputmode Suppression Test</title>
    <script
      id="sap-ui-bootstrap"
      src="../../../../../resources/sap-ui-core.js"
      data-sap-ui-theme="sap_horizon"
      data-sap-ui-libs="sap.m, ui5.kiosk"
      data-sap-ui-compat-version="edge"
      data-sap-ui-resource-roots='{"ui5.kiosk": "../../../../../resources/ui5/kiosk/", "inputmode": "./"}'
      data-sap-ui-async="true"
      data-sap-ui-on-init="module:inputmode/init"
    ></script>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: "72", Arial, sans-serif;
        background: #f5f6f7;
      }
      .section {
        margin-bottom: 40px;
      }
      .section h2 {
        font-size: 16px;
        color: #32363a;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <h1 style="font-size: 20px; color: #32363a">inputmode Suppression Test</h1>

    <div class="section">
      <h2>1. Custom mode (suppress native)</h2>
      <div id="input-custom" style="margin-bottom: 12px"></div>
      <div id="kb-custom"></div>
    </div>

    <div class="section">
      <h2>2. Native mode (defer to native)</h2>
      <div id="input-native" style="margin-bottom: 12px"></div>
      <div id="kb-native"></div>
    </div>

    <div class="section">
      <h2>3. Auto mode (desktop = suppress)</h2>
      <div id="input-auto" style="margin-bottom: 12px"></div>
      <div id="kb-auto"></div>
    </div>

    <!-- Click target to remove focus from inputs -->
    <div id="blur-target" style="padding: 20px; margin-top: 40px; background: #e0e0e0; text-align: center">
      Click here to blur
    </div>
  </body>
</html>
