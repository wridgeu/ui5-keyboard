specVersion: "4.0"
metadata:
  name: ui5.kiosk
type: library
framework:
  name: OpenUI5
  version: "1.136.18"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: themelib_sap_horizon
builder:
  resources:
    excludes:
      - "/test-resources/**"
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        omitTSFromBuildResult: true
        transformTypeScript:
          allowDeclareFields: true
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        transformTypeScript:
          allowDeclareFields: true
