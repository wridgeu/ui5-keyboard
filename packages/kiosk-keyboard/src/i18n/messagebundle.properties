# Resource bundle for ui5.kiosk library
# Default (English)

# Root aria-label and accessibility info
KIOSK_KEYBOARD_LABEL=Virtual Keyboard
KIOSK_KEYBOARD_ROLEDESCRIPTION=keyboard

# Key labels (visual + ARIA)
