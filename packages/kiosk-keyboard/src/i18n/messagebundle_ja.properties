# Resource bundle for ui5.kiosk library
# Japanese
# UI5 text classification reference (text types):
# https://ui5.sap.com/#/topic/582ce93d326540f59d149031a44d5fb0
# https://github.com/SAP-docs/sapui5/blob/main/docs/05_Developing_Apps/text-classification-582ce93.md

#XACT: ARIA label for the keyboard root when ariaLabel is not set
KIOSK_KEYBOARD_LABEL=\u4eee\u60f3\u30ad\u30fc\u30dc\u30fc\u30c9
#XACT: ARIA roledescription for the keyboard root
KIOSK_KEYBOARD_ROLEDESCRIPTION=\u30ad\u30fc\u30dc\u30fc\u30c9

#XBUT: Label for Shift key (visible text; also used as aria-label when label is suppressed)
KEY_SHIFT=\u30b7\u30d5\u30c8
#XBUT: Label for Enter key (visible text; also used as aria-label when label is suppressed)
KEY_ENTER=\u30a8\u30f3\u30bf\u30fc
#XBUT: Label for Backspace key (visible text; also used as aria-label when label is suppressed)
KEY_BACKSPACE=\u30d0\u30c3\u30af\u30b9\u30da\u30fc\u30b9
#XBUT: Label for Space key
KEY_SPACE=\u30b9\u30da\u30fc\u30b9

#XACT: Accessible name for the back key that returns to the numbers surface
ARIA_RETURN_TO_NUMBERS=\u6570\u5b57\u306b\u623b\u308b
#XACT: ARIA label for Shift key when Caps Lock is active
ARIA_CAPS_LOCK=Caps Lock
#XACT: ARIA live announcement when Caps Lock is enabled
ARIA_CAPS_LOCK_ON=Caps Lock \u30aa\u30f3
#XACT: ARIA live announcement when Shift is enabled
ARIA_SHIFT_ON=\u30b7\u30d5\u30c8 \u30aa\u30f3
#XACT: ARIA live announcement when keyboard opens
ARIA_KEYBOARD_OPENED=\u4eee\u60f3\u30ad\u30fc\u30dc\u30fc\u30c9\u3092\u958b\u304d\u307e\u3057\u305f
#XACT: ARIA live announcement when keyboard closes
ARIA_KEYBOARD_CLOSED=\u4eee\u60f3\u30ad\u30fc\u30dc\u30fc\u30c9\u3092\u9589\u3058\u307e\u3057\u305f
#XACT: ARIA live announcement when the keyboard changes its own layout to fit the space it has ({0}=layout name)
ARIA_LAYOUT_CHANGED=キーボードレイアウトを {0} に変更しました
#XACT: ARIA live announcement when the accent-variant popup opens ({0}=count, {1}=base glyph)
ARIA_VARIANTS_OPENED={1} \u306e\u30d0\u30ea\u30a2\u30f3\u30c8 {0} \u500b
#XACT: ARIA live announcement when the accent-variant popup is dismissed
ARIA_VARIANTS_CLOSED=\u30d0\u30ea\u30a2\u30f3\u30c8\u3092\u9589\u3058\u307e\u3057\u305f
