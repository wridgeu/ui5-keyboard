specVersion: "4.0"
metadata:
  name: ui5.hotkeys
type: library
framework:
  name: OpenUI5
  version: "1.136.18"
  libraries:
    - name: sap.ui.core
    # Development-only: HotkeyManager optionally integrates with sap.m.InstanceManager
    # for popup-aware suppression (probed lazily, never a runtime dependency). Declared
    # here so the QUnit suite can load and stub the real collaborator.
    - name: sap.m
      development: true
builder:
  resources:
    excludes:
      - "/test-resources/**"
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        omitTSFromBuildResult: true
        transformTypeScript:
          allowDeclareFields: true
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        transformTypeScript:
          allowDeclareFields: true
