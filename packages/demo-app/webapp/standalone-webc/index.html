<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Standalone UI5 Web Components Demo</title>
    <script type="module" src="./main.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg-a: #f7f3ea;
        --bg-b: #dbe8e6;
        --panel: #ffffff;
        --border: #c9d8d6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "72", Arial, sans-serif;
        background: linear-gradient(135deg, var(--bg-a), var(--bg-b));
        color: #1e2b2b;
      }

      main {
        width: min(920px, 100% - 2rem);
        margin: 2rem auto;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1.25rem;
      }

      .stack {
        display: grid;
        gap: 0.75rem;
      }

      .row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Standalone UI5 Web Components</h1>
      <p>
        This page demonstrates framework-agnostic consumption of <code>@ui5/webcomponents</code> in plain HTML + ES
        modules, independent from SAPUI5 runtime.
      </p>

      <section class="stack">
        <ui5-label for="nameInput">Name</ui5-label>
        <ui5-input id="nameInput" placeholder="Type your name"></ui5-input>
        <ui5-textarea id="messageInput" rows="4" placeholder="Write a message"></ui5-textarea>
        <div class="row">
          <ui5-button id="greetBtn" design="Emphasized">Greet</ui5-button>
          <ui5-button id="clearBtn" design="Transparent">Clear</ui5-button>
        </div>
        <ui5-message-strip id="statusStrip" design="Information" hide-close-button> Ready </ui5-message-strip>
      </section>
    </main>
  </body>
</html>
