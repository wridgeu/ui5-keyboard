<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI5 Keyboard Libraries: Fiori Launchpad</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <!--
      Static Fiori Launchpad (ushell) sandbox for GitHub Pages.

      Unlike the dev-time `npm run start:flp` flow (which lets
      @sap-ux/preview-middleware generate the sandbox and tiles on the fly),
      this page is fully static so it can be hosted from a plain file server.

      Runtime note: the FLP/ushell sandbox is NOT part of OpenUI5; it only
      ships with SAPUI5. The Pages build therefore uses the SAPUI5 framework
      (ui5-pages.yaml) and `ui5 build --all` to bundle core + ushell into this
      artifact (trimmed by tools/trim-pages-dist.mjs), so the page loads
      everything from relative paths with NO external CDN. The app's own
      Component-preload and the custom libraries (ui5.hotkeys / ui5.kiosk) are
      served from the same artifact via the resourceroots below.
    -->
    <script src="flp-config.js"></script>

    <!-- ushell sandbox bootstrap (self-hosted from this artifact). -->
    <script id="sap-ushell-bootstrap" src="test-resources/sap/ushell/bootstrap/sandbox.js"></script>

    <!--
      UI5 core bootstrap. `data-sap-ui-frame-options="allow"` is a NON-SECURE
      setting acceptable only for this demo/sandbox use case. Resource roots map
      the app + custom libraries to paths inside this artifact; the SAPUI5
      runtime is self-hosted under resources/ (no external CDN).
    -->
    <script
      id="sap-ui-bootstrap"
      src="resources/sap-ui-core.js"
      data-sap-ui-libs="sap.m,sap.ushell,sap.ui.core,sap.ui.layout"
      data-sap-ui-async="true"
      data-sap-ui-preload="async"
      data-sap-ui-theme="sap_horizon"
      data-sap-ui-compat-version="edge"
      data-sap-ui-frame-options="allow"
      data-sap-ui-resource-roots='{ "demo.hotkeys": "./", "ui5.hotkeys": "./resources/ui5/hotkeys", "ui5.kiosk": "./resources/ui5/kiosk" }'
    ></script>

    <script src="flp-init.js"></script>
  </head>
  <body class="sapUiBody" id="content"></body>
</html>
