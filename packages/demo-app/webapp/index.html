<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI5 Keyboard Libraries Demo</title>
    <style>
      /* Popover demo: constrain the keyboard element directly so responsive
         height breakpoints detect the constraint. overflow:hidden prevents
         the Popover from adding a scrollbar. */
      .demoPopoverKbGenerous {
        height: 19rem;
        overflow: hidden;
      }
      .demoPopoverKbCompact {
        height: 15rem;
        overflow: hidden;
      }
      /* Instead of height constraints, shrink keys via CSS custom properties
         so the keyboard naturally fits in less vertical space.
         Double-class selector beats the single-class defaults in the library. */
      .ui5KioskKeyboard.demoPopoverKbCustomVars {
        --ui5KioskKeyboard-keyHeight: 2.25rem;
        --ui5KioskKeyboard-keyGap: 0.25rem;
        --ui5KioskKeyboard-padding: 0.5rem;
      }
    </style>
    <script
      id="sap-ui-bootstrap"
      src="resources/sap-ui-core.js"
      data-sap-ui-theme="sap_horizon"
      data-sap-ui-resource-roots='{ "demo.hotkeys": "./" }'
      data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
      data-sap-ui-compat-version="edge"
      data-sap-ui-async="true"
    ></script>
  </head>
  <body class="sapUiBody" id="content">
    <div
      data-sap-ui-component
      data-name="demo.hotkeys"
      data-id="container"
      data-settings='{ "id": "demo.hotkeys" }'
    ></div>
  </body>
</html>
