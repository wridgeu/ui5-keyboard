<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI5 Keyboard Libraries Demo</title>
    <style>
      /* Demo: fixed height on the keyboard element itself (Popover scenario C) */
      .demoPopoverKeyboardFixedHeight {
        height: 18rem;
        overflow: hidden;
      }
    </style>
    <script
      id="sap-ui-bootstrap"
      src="resources/sap-ui-core.js"
      data-sap-ui-theme="sap_horizon"
      data-sap-ui-resource-roots='{ "demo.hotkeys": "./" }'
      data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
      data-sap-ui-compat-version="edge"
      data-sap-ui-async="true"
    ></script>
  </head>
  <body class="sapUiBody" id="content">
    <div
      data-sap-ui-component
      data-name="demo.hotkeys"
      data-id="container"
      data-settings='{ "id": "demo.hotkeys" }'
    ></div>
  </body>
</html>
