# Enhancement bundle: French translations for ui5.kiosk
# Demonstrates adding a new language not shipped with the library
# UI5 text classification reference (text types):
# https://ui5.sap.com/#/topic/582ce93d326540f59d149031a44d5fb0
# https://github.com/SAP-docs/sapui5/blob/main/docs/05_Developing_Apps/text-classification-582ce93.md

#XACT: ARIA label for the keyboard root when accessibleName is not set
KIOSK_KEYBOARD_LABEL=Clavier virtuel
#XACT: ARIA roledescription for the keyboard root
KIOSK_KEYBOARD_ROLEDESCRIPTION=clavier

#XBUT: Label for Shift key (used as ARIA label for icon-only key)
KEY_SHIFT=Maj
#XBUT: Label for Enter key (used as ARIA label for icon-only key)
KEY_ENTER=Entr\u00e9e
#XBUT: Label for Backspace key (used as ARIA label for icon-only key)
KEY_BACKSPACE=Retour
#XBUT: Label for Space key
KEY_SPACE=Espace

#XACT: ARIA label for Shift key when Caps Lock is active
ARIA_CAPS_LOCK=Verrouillage majuscule
#XACT: ARIA live announcement when Caps Lock is enabled
ARIA_CAPS_LOCK_ON=Verrouillage majuscule activ\u00e9
#XACT: ARIA live announcement when Shift is enabled
ARIA_SHIFT_ON=Majuscule activ\u00e9e
#XACT: ARIA live announcement when keyboard opens
ARIA_KEYBOARD_OPENED=Clavier virtuel ouvert
#XACT: ARIA live announcement when keyboard closes
ARIA_KEYBOARD_CLOSED=Clavier virtuel ferm\u00e9
