specVersion: "4.0"
metadata:
  name: demo.hotkeys
type: application
framework:
  name: SAPUI5
  version: "1.144.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.ushell
      development: true
    - name: themelib_sap_horizon
builder:
  customTasks:
    - name: ui5-tooling-modules-task
      afterTask: replaceVersion
      configuration:
        addToNamespace: true
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        omitTSFromBuildResult: true
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        transpileDependencies: true
        transformTypeScript:
          allowDeclareFields: true
    - name: ui5-tooling-modules-middleware
      afterMiddleware: ui5-tooling-transpile-middleware
      configuration:
        addToNamespace: true
        useRelativeModulePaths: true
    - name: preview-middleware
      afterMiddleware: ui5-tooling-transpile-middleware
      configuration:
        flp:
          path: /test/flp.html
          theme: sap_horizon
          intent:
            object: DemoApp
            action: display
    - name: ui5-middleware-livereload
      afterMiddleware: compression
