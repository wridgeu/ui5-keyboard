# Build config for the self-hosted GitHub Pages deployment.
#
# Unlike ui5.yaml (OpenUI5, used for `npm start` dev), this uses the SAPUI5
# framework so the Fiori Launchpad shell (sap.ushell, which is NOT part of
# OpenUI5) can be bundled into the artifact via `ui5 build --all`. The deployed
# site is then fully self-hosted with no external CDN dependency.
#
# SAPUI5 is under the SAP Developer License (not Apache-2.0 like OpenUI5); it is
# bundled here for a public demo/evaluation deployment. The build output is
# trimmed by tools/trim-pages-dist.mjs (minified-only, single theme, unused
# libraries dropped) to keep the artifact small.
specVersion: "4.0"
metadata:
  name: demo.hotkeys
type: application
framework:
  name: SAPUI5
  version: "1.149.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.ushell
    - name: themelib_sap_horizon
builder:
  customTasks:
    - name: ui5-tooling-modules-task
      afterTask: replaceVersion
      configuration:
        addToNamespace: true
        # See packages/demo-app/ui5.yaml for the rationale on scoping: false.
        pluginOptions:
          webcomponents:
            scoping: false
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        omitTSFromBuildResult: true
