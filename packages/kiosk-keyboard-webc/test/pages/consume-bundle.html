<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Native Consumption -- Standalone Bundle</title>
    <style>
      body {
        margin: 2rem;
        font-family: sans-serif;
      }
      h1 {
        font-size: 1.2rem;
      }
      p {
        color: #666;
        font-size: 0.85rem;
      }
      input {
        font-size: 1rem;
        padding: 0.5rem;
        width: 100%;
        max-width: 400px;
        margin-bottom: 1rem;
      }
    </style>
    <!-- Self-contained standalone bundle -- no import map, no dev server needed -->
    <script type="module" src="../../dist/kiosk-keyboard.bundle.js"></script>
  </head>
  <body>
    <h1>Standalone Bundle Consumption</h1>
    <p>
      Loads <code>kiosk-keyboard.bundle.js</code> directly. No UI5 runtime, no import map, no dev server. Open this file
      via any static server.
    </p>
    <input id="target" type="text" placeholder="Click here, then type on the keyboard" />
    <kiosk-keyboard layout="qwerty" for="target" docked auto-show></kiosk-keyboard>
  </body>
</html>
