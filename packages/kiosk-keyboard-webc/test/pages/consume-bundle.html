<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Standalone Bundle Consumption</title>
    <style>
      body {
        margin: 2rem;
        font-family: sans-serif;
      }
      h1 {
        font-size: 1.2rem;
      }
      p {
        color: #666;
        font-size: 0.85rem;
      }
      input {
        font-size: 1rem;
        padding: 0.5rem;
        width: 100%;
        max-width: 400px;
        margin-bottom: 1rem;
      }
      #status {
        padding: 0.5rem 1rem;
        border-radius: 4px;
        font-weight: bold;
        margin-bottom: 1rem;
        display: inline-block;
      }
      #status.pass {
        background: #d4edda;
        color: #155724;
      }
      #status.fail {
        background: #f8d7da;
        color: #721c24;
      }
    </style>
    <!-- Self-contained standalone bundle: no import map, no dev server needed -->
    <script type="module" src="../../dist/kiosk-keyboard.bundle.js"></script>
  </head>
  <body>
    <h1>Standalone Bundle Consumption</h1>
    <p>
      Loads <code>kiosk-keyboard.bundle.js</code> directly. No UI5 runtime, no import map, no dev server. Open this file
      via any static server.
    </p>
    <div id="status">Checking...</div>
    <br />
    <input id="target" type="text" placeholder="Click here, then type on the keyboard" />
    <kiosk-keyboard layout="qwerty" controls="target" docked auto-show></kiosk-keyboard>

    <script type="module">
      const status = document.getElementById("status");
      const checks = [];
      try {
        // 1. Custom element registered
        await customElements.whenDefined("kiosk-keyboard");
        checks.push("element registered");

        // 2. Element upgraded and has shadow DOM
        const el = document.querySelector("kiosk-keyboard");
        if (!el || !el.shadowRoot) throw new Error("no shadow root");
        checks.push("shadow DOM present");

        // 3. Keyboard rows rendered
        const rows = el.shadowRoot.querySelectorAll("[part='row']");
        if (rows.length === 0) throw new Error("no keyboard rows rendered");
        checks.push(`${rows.length} rows rendered`);

        status.textContent = `PASS: ${checks.join(", ")}`;
        status.className = "pass";
        document.title = "PASS - Standalone Bundle";
      } catch (err) {
        status.textContent = `FAIL: ${err.message} (after: ${checks.join(", ") || "none"})`;
        status.className = "fail";
        document.title = "FAIL - Standalone Bundle";
      }
    </script>
  </body>
</html>
