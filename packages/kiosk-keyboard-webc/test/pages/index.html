<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KioskKeyboard Web Component — Standalone Test Page</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: "72", Arial, Helvetica, sans-serif;
        background: #f5f6f7;
      }
      h1 {
        font-size: 20px;
        color: #32363a;
      }
      .section {
        margin-bottom: 40px;
      }
      .section h2 {
        font-size: 16px;
        color: #32363a;
        margin-bottom: 12px;
      }
      .keyboard-container {
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        display: inline-block;
      }
      input,
      textarea {
        font-family: inherit;
        font-size: 14px;
        padding: 8px;
        border: 1px solid #bfbfbf;
        border-radius: 4px;
        width: 300px;
        display: block;
        margin-bottom: 8px;
      }
      label {
        display: block;
        margin-bottom: 4px;
        color: #32363a;
        font-size: 13px;
      }
      #event-log {
        font-family: monospace;
        font-size: 12px;
        background: #1a1a2e;
        color: #0f0;
        padding: 12px;
        border-radius: 4px;
        max-height: 200px;
        overflow-y: auto;
        white-space: pre-wrap;
      }
    </style>
    <script type="module">
      import "../../dist/KioskKeyboard.js";

      // Event log
      const log = document.getElementById("event-log");
      function appendLog(msg) {
        log.textContent += msg + "\n";
        log.scrollTop = log.scrollHeight;
      }

      // Wire event listeners on docked keyboard
      const docked = document.getElementById("kb-docked");
      docked.addEventListener("key-press", (e) => {
        appendLog(`key-press: key="${e.detail.key}" shift=${e.detail.shiftKey}`);
      });
      docked.addEventListener("layout-change", (e) => {
        appendLog(`layout-change: layout="${e.detail.layout}"`);
      });
      docked.addEventListener("after-open", () => appendLog("after-open"));
      docked.addEventListener("after-close", () => appendLog("after-close"));

      // Toggle docked keyboard
      document.getElementById("toggle-docked").addEventListener("click", () => {
        if (docked.open) docked.close();
        else docked.show();
      });
    </script>
  </head>
  <body>
    <h1>KioskKeyboard Web Component — Standalone</h1>
    <p style="color: #666; font-size: 13px">No UI5 runtime. Pure custom element usage.</p>

    <div class="section">
      <h2>1. Full QWERTY (inline)</h2>
      <div class="keyboard-container">
        <kiosk-keyboard id="kb-qwerty" layout="qwerty"></kiosk-keyboard>
      </div>
    </div>

    <div class="section">
      <h2>2. With Input Target</h2>
      <label for="text-input">Target Input</label>
      <input id="text-input" type="text" placeholder="Type here via keyboard" />
      <div class="keyboard-container">
        <kiosk-keyboard layout="qwerty" for="text-input" auto-type></kiosk-keyboard>
      </div>
    </div>

    <div class="section">
      <h2>3. Numpad</h2>
      <div class="keyboard-container">
        <kiosk-keyboard keyboard-type="Numpad"></kiosk-keyboard>
      </div>
    </div>

    <div class="section">
      <h2>4. Numeric</h2>
      <div class="keyboard-container">
        <kiosk-keyboard keyboard-type="Numeric"></kiosk-keyboard>
      </div>
    </div>

    <div class="section">
      <h2>5. Disabled State</h2>
      <div class="keyboard-container">
        <kiosk-keyboard layout="qwerty" disabled></kiosk-keyboard>
      </div>
    </div>

    <div class="section">
      <h2>6. QWERTZ-DE</h2>
      <div class="keyboard-container">
        <kiosk-keyboard layout="qwertz-de"></kiosk-keyboard>
      </div>
    </div>

    <div class="section">
      <h2>7. Narrow (320px container)</h2>
      <div class="keyboard-container" style="width: 320px">
        <kiosk-keyboard layout="qwerty"></kiosk-keyboard>
      </div>
    </div>

    <div class="section">
      <h2>8. Docked Mode (auto-show + auto-type)</h2>
      <label for="docked-input-name">Full Name</label>
      <input id="docked-input-name" type="text" placeholder="John Doe" />
      <label for="docked-input-age">Age (numpad auto-type)</label>
      <input id="docked-input-age" type="number" placeholder="25" />
      <button id="toggle-docked" style="padding: 8px 16px; cursor: pointer; margin-bottom: 8px">Toggle Docked</button>
      <kiosk-keyboard
        id="kb-docked"
        docked
        auto-show
        auto-type
        input-ids="docked-input-name,docked-input-age"
      ></kiosk-keyboard>
    </div>

    <div class="section">
      <h2>9. Event Log</h2>
      <div id="event-log"></div>
    </div>
  </body>
</html>
