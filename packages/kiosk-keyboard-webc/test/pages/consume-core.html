<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Core Entry -- Lean Consumption</title>
    <style>
      body {
        margin: 2rem;
        font-family: sans-serif;
      }
      h1 {
        font-size: 1.2rem;
      }
      p {
        color: #666;
        font-size: 0.85rem;
      }
      input {
        font-size: 1rem;
        padding: 0.5rem;
        width: 100%;
        max-width: 400px;
        margin-bottom: 1rem;
      }
      #status {
        padding: 0.5rem 1rem;
        border-radius: 4px;
        font-weight: bold;
        margin-bottom: 1rem;
        display: inline-block;
      }
      #status.pass {
        background: #d4edda;
        color: #155724;
      }
      #status.fail {
        background: #f8d7da;
        color: #721c24;
      }
    </style>
    <!--
      Lean consumption: imports only the core component (no built-in layouts),
      then cherry-picks a single layout. Requires Vite to resolve bare specifiers.
      Run via `npm start`.
    -->
    <script type="module">
      // Core entry -- component class only, no layouts
      import KioskKeyboard from "../../dist/KioskKeyboardCore.js";
      // Cherry-pick one layout
      import "../../dist/layouts/numeric.js";

      // Register a custom layout to prove the API works
      KioskKeyboard.registerLayout("custom-pin", [
        [{ value: "1" }, { value: "2" }, { value: "3" }],
        [{ value: "4" }, { value: "5" }, { value: "6" }],
        [{ value: "7" }, { value: "8" }, { value: "9" }],
        [
          { value: "{backspace}", type: "action", width: "1.5" },
          { value: "0" },
          { value: "{enter}", type: "action", width: "1.5" },
        ],
      ]);
    </script>
  </head>
  <body>
    <h1>Core Entry -- Lean Consumption</h1>
    <p>
      Imports <code>KioskKeyboardCore</code> (no built-in layouts), cherry-picks <code>numeric</code>, and registers a
      custom <code>custom-pin</code> layout. Validates that lean consumption works without pulling in all 16 built-in
      layouts. Run via <code>npm start</code>.
    </p>
    <div id="status">Checking...</div>
    <br />
    <input id="target" type="text" placeholder="Click here, then type on the keyboard" />
    <kiosk-keyboard layout="custom-pin" for="target" docked auto-show></kiosk-keyboard>

    <script type="module">
      // Dynamic import so we can use the class after the first module block registers everything
      const { default: KioskKeyboard } = await import("../../dist/KioskKeyboardCore.js");
      const status = document.getElementById("status");
      const checks = [];
      try {
        await customElements.whenDefined("kiosk-keyboard");
        checks.push("element registered");

        const el = document.querySelector("kiosk-keyboard");
        if (!el || !el.shadowRoot) throw new Error("no shadow root");
        checks.push("shadow DOM present");

        // Verify only the cherry-picked and custom layouts are available
        const names = KioskKeyboard.getRegisteredLayoutNames();
        if (!names.includes("numeric")) throw new Error("cherry-picked 'numeric' layout missing");
        checks.push("numeric layout loaded");

        if (!names.includes("custom-pin")) throw new Error("custom 'custom-pin' layout missing");
        checks.push("custom-pin layout registered");

        // Verify the keyboard rendered rows from custom-pin
        const rows = el.shadowRoot.querySelectorAll("[part='row']");
        if (rows.length === 0) throw new Error("no keyboard rows rendered");
        checks.push(`${rows.length} rows rendered`);

        status.textContent = `PASS: ${checks.join(", ")}`;
        status.className = "pass";
        document.title = "PASS - Core Entry";
      } catch (err) {
        status.textContent = `FAIL: ${err.message} (after: ${checks.join(", ") || "none"})`;
        status.className = "fail";
        document.title = "FAIL - Core Entry";
      }
    </script>
  </body>
</html>
