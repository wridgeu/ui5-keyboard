<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KioskKeyboard Web Component - Visual Test</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
        font-family: "72", Arial, Helvetica, sans-serif;
        background: #f5f6f7;
      }
      .section {
        margin-bottom: 40px;
      }
      .section h2 {
        font-size: 16px;
        color: #32363a;
        margin-bottom: 12px;
      }
    </style>
    <script type="module">
      import "../../dist/kiosk-keyboard.bundle.js";
    </script>
  </head>
  <body>
    <h1 style="font-size: 20px; color: #32363a">KioskKeyboard Web Component - Visual Inspection</h1>

    <div class="section">
      <h2>1. Full QWERTY (default)</h2>
      <kiosk-keyboard id="kb-qwerty" layout="qwerty"></kiosk-keyboard>
    </div>

    <div class="section">
      <h2>2. With Input Target</h2>
      <input id="text-input" type="text" placeholder="Target input" style="margin-bottom: 12px; display: block" />
      <kiosk-keyboard layout="qwerty" for="text-input"></kiosk-keyboard>
    </div>

    <div class="section">
      <h2>3. Numpad</h2>
      <kiosk-keyboard keyboard-type="Numpad"></kiosk-keyboard>
    </div>

    <div class="section">
      <h2>4. Numeric</h2>
      <kiosk-keyboard keyboard-type="Numeric"></kiosk-keyboard>
    </div>

    <div class="section">
      <h2>5. Disabled State</h2>
      <kiosk-keyboard disabled layout="qwerty"></kiosk-keyboard>
    </div>

    <div class="section">
      <h2>6. QWERTZ-DE</h2>
      <kiosk-keyboard layout="qwertz-de"></kiosk-keyboard>
    </div>

    <div class="section">
      <h2>7. Narrow (320px container)</h2>
      <div style="max-width: 320px">
        <kiosk-keyboard id="kb-narrow" layout="qwerty"></kiosk-keyboard>
      </div>
    </div>

    <div class="section">
      <h2>8. Docked Mode</h2>
      <kiosk-keyboard id="kb-docked" docked></kiosk-keyboard>
    </div>
  </body>
</html>
