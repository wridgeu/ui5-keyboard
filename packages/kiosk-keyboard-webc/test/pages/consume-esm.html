<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ESM Consumption (tsc output)</title>
    <style>
      body {
        margin: 2rem;
        font-family: sans-serif;
      }
      h1 {
        font-size: 1.2rem;
      }
      p {
        color: #666;
        font-size: 0.85rem;
      }
      input {
        font-size: 1rem;
        padding: 0.5rem;
        width: 100%;
        max-width: 400px;
        margin-bottom: 1rem;
      }
      #status {
        padding: 0.5rem 1rem;
        border-radius: 4px;
        font-weight: bold;
        margin-bottom: 1rem;
        display: inline-block;
      }
      #status.pass {
        background: #d4edda;
        color: #155724;
      }
      #status.fail {
        background: #f8d7da;
        color: #721c24;
      }
    </style>
    <!--
      Bare ESM imports -- requires a dev server that resolves bare specifiers
      (e.g., `npm start` which runs Vite). Validates the flat tsc output and
      module graph work in a real browser.
    -->
    <script type="module">
      import "../../dist/bundle.esm.js";
    </script>
  </head>
  <body>
    <h1>ESM Consumption (tsc output)</h1>
    <p>
      Imports <code>dist/bundle.esm.js</code> (flat tsc output). Bare specifiers like
      <code>@ui5/webcomponents-base</code> are resolved by Vite. Run via <code>npm start</code>.
    </p>
    <div id="status">Checking...</div>
    <br />
    <input id="target" type="text" placeholder="Click here, then type on the keyboard" />
    <kiosk-keyboard layout="qwerty" for="target" docked auto-show></kiosk-keyboard>

    <script type="module">
      const status = document.getElementById("status");
      const checks = [];
      try {
        await customElements.whenDefined("kiosk-keyboard");
        checks.push("element registered");

        const el = document.querySelector("kiosk-keyboard");
        if (!el || !el.shadowRoot) throw new Error("no shadow root");
        checks.push("shadow DOM present");

        const rows = el.shadowRoot.querySelectorAll("[part='row']");
        if (rows.length === 0) throw new Error("no keyboard rows rendered");
        checks.push(`${rows.length} rows rendered`);

        status.textContent = `PASS: ${checks.join(", ")}`;
        status.className = "pass";
        document.title = "PASS - ESM Consumption";
      } catch (err) {
        status.textContent = `FAIL: ${err.message} (after: ${checks.join(", ") || "none"})`;
        status.className = "fail";
        document.title = "FAIL - ESM Consumption";
      }
    </script>
  </body>
</html>
