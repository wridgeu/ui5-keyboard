# Resource bundle for kiosk-keyboard-webc
# Default (English)

#XACT: ARIA label for the keyboard root when accessibleName is not set
KIOSK_KEYBOARD_LABEL=Virtual Keyboard
#XACT: ARIA roledescription for the keyboard root
KIOSK_KEYBOARD_ROLEDESCRIPTION=keyboard

#XBUT: Label for Shift key (visible text; also used as aria-label when label is suppressed)
KEY_SHIFT=Shift
#XBUT: Label for Enter key (visible text; also used as aria-label when label is suppressed)
KEY_ENTER=Enter
#XBUT: Label for Backspace key (visible text; also used as aria-label when label is suppressed)
KEY_BACKSPACE=Backspace
#XBUT: Label for Space key
KEY_SPACE=Space
#XBUT: Visible label for the Shift key when Caps Lock is engaged
KEY_CAPS_LOCK=Caps Lock

#XACT: Accessible name for the back key that returns to the numbers surface
ARIA_RETURN_TO_NUMBERS=Return to numbers

#XACT: ARIA live announcement when Caps Lock is enabled
ARIA_CAPS_LOCK_ON=Caps Lock on
#XACT: ARIA live announcement when Shift is enabled
ARIA_SHIFT_ON=Shift on
#XACT: ARIA live announcement when Shift is released
ARIA_SHIFT_OFF=Shift off
#XACT: ARIA live announcement when keyboard opens
ARIA_KEYBOARD_OPENED=Virtual keyboard opened
#XACT: ARIA live announcement when keyboard closes
ARIA_KEYBOARD_CLOSED=Virtual keyboard closed
#XACT: ARIA live announcement when a narrowing keyboard takes a layout's compact form
ARIA_LAYOUT_COMPACTED=Switched to the compact keyboard layout
#XACT: ARIA live announcement when a widening keyboard gives the compact form back
ARIA_LAYOUT_UNCOMPACTED=Switched back to the standard keyboard layout

#XACT: ARIA live announcement when the accent-variant popup opens ({0}=count, {1}=base glyph)
ARIA_VARIANTS_OPENED={0} variants for {1}
#XACT: ARIA live announcement when the accent-variant popup is dismissed
ARIA_VARIANTS_CLOSED=Variants closed
