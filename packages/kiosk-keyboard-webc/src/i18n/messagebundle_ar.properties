# Resource bundle for kiosk-keyboard-webc
# Arabic

#XACT: ARIA label for the keyboard root when accessibleName is not set
KIOSK_KEYBOARD_LABEL=\u0644\u0648\u062d\u0629 \u0645\u0641\u0627\u062a\u064a\u062d \u0627\u0641\u062a\u0631\u0627\u0636\u064a\u0629
#XACT: ARIA roledescription for the keyboard root
KIOSK_KEYBOARD_ROLEDESCRIPTION=\u0644\u0648\u062d\u0629 \u0645\u0641\u0627\u062a\u064a\u062d

#XBUT: Label for Shift key (visible text; also used as aria-label when label is suppressed)
KEY_SHIFT=\u062a\u062d\u0648\u064a\u0644
#XBUT: Label for Enter key (visible text; also used as aria-label when label is suppressed)
KEY_ENTER=\u0625\u062f\u062e\u0627\u0644
#XBUT: Label for Backspace key (visible text; also used as aria-label when label is suppressed)
KEY_BACKSPACE=\u0645\u0633\u062d
#XBUT: Label for Space key
KEY_SPACE=\u0645\u0633\u0627\u0641\u0629
#XBUT: Visible label for the Shift key when Caps Lock is engaged
KEY_CAPS_LOCK=Caps Lock

#XACT: Accessible name for the back key that returns to the numbers surface
ARIA_RETURN_TO_NUMBERS=\u0627\u0644\u0639\u0648\u062f\u0629 \u0625\u0644\u0649 \u0627\u0644\u0623\u0631\u0642\u0627\u0645
#XACT: ARIA live announcement when Caps Lock is enabled
ARIA_CAPS_LOCK_ON=Caps Lock \u0645\u064f\u0641\u0639\u0651\u0644
#XACT: ARIA live announcement when Caps Lock is released
ARIA_CAPS_LOCK_OFF=Caps Lock \u0645\u064f\u0639\u0637\u0651\u0644
#XACT: ARIA live announcement when Shift is enabled
ARIA_SHIFT_ON=\u062a\u062d\u0648\u064a\u0644 \u0645\u064f\u0641\u0639\u0651\u0644
#XACT: ARIA live announcement when Shift is released
ARIA_SHIFT_OFF=\u062a\u062d\u0648\u064a\u0644 \u0645\u064f\u0639\u0637\u0651\u0644
#XACT: ARIA live announcement when keyboard opens
ARIA_KEYBOARD_OPENED=\u062a\u0645 \u0641\u062a\u062d \u0644\u0648\u062d\u0629 \u0627\u0644\u0645\u0641\u0627\u062a\u064a\u062d \u0627\u0644\u0627\u0641\u062a\u0631\u0627\u0636\u064a\u0629
#XACT: ARIA live announcement when keyboard closes
ARIA_KEYBOARD_CLOSED=\u062a\u0645 \u0625\u063a\u0644\u0627\u0642 \u0644\u0648\u062d\u0629 \u0627\u0644\u0645\u0641\u0627\u062a\u064a\u062d \u0627\u0644\u0627\u0641\u062a\u0631\u0627\u0636\u064a\u0629
#XACT: ARIA live announcement when a narrowing keyboard takes a layout's compact form
ARIA_LAYOUT_COMPACTED=\u062a\u0645 \u0627\u0644\u062a\u0628\u062f\u064a\u0644 \u0625\u0644\u0649 \u062a\u062e\u0637\u064a\u0637 \u0644\u0648\u062d\u0629 \u0645\u0641\u0627\u062a\u064a\u062d \u0645\u0636\u063a\u0648\u0637
#XACT: ARIA live announcement when a widening keyboard gives the compact form back
ARIA_LAYOUT_UNCOMPACTED=\u062a\u0645\u062a \u0627\u0644\u0639\u0648\u062f\u0629 \u0625\u0644\u0649 \u062a\u062e\u0637\u064a\u0637 \u0644\u0648\u062d\u0629 \u0627\u0644\u0645\u0641\u0627\u062a\u064a\u062d \u0627\u0644\u0642\u064a\u0627\u0633\u064a
#XACT: ARIA live announcement when the accent-variant popup opens ({0}=count, {1}=base glyph; keep the count last so no locale needs a plural form)
ARIA_VARIANTS_OPENED=\u0628\u062f\u0627\u0626\u0644 \u0644\u0640 {1}: {0}
#XACT: ARIA live announcement when the accent-variant popup is dismissed
ARIA_VARIANTS_CLOSED=\u062a\u0645 \u0625\u063a\u0644\u0627\u0642 \u0627\u0644\u0628\u062f\u0627\u0626\u0644
